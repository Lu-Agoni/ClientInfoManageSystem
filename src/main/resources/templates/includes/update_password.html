<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <link rel="stylesheet" th:href="@{/CSS/style.css}">
</head>
<body class="list-page">
<h3>修改登录密码</h3>
<form method="post" action="/user/updatePwd" target="_top">
    <div>
        原密码：<input type="password" name="oldPwd"><br><br>
        新密码：<input type="password" name="newPwd"><br><br>
        确认新密码：<input type="password" name="rePwd"><br><br>
        <button type="submit">提交修改</button>
    </div>
    <div style="color:red" th:text="${msg}"></div>
</form>
</body>
</html>
